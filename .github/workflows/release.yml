name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check tag matches mod_version
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$version"
            exit 1
          fi
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sea of Memory ${{ env.MOD_VERSION }}
          files: build/libs/seaofmemory-${{ env.MOD_VERSION }}.jar
          generate_release_notes: true
          prerelease: ${{ contains(env.MOD_VERSION, '-') }}
          fail_on_unmatched_files: true
